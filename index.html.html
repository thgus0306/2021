<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>미래의 나, 하루 체험 스튜디오</title><style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#20312d;--muted:#61736e;--accent:#477d70;--soft:#e3efeb;--line:#d7e2de;--ok:#eef8e9}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}.wrap{max-width:1000px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:clamp(27px,5vw,42px);margin:8px 0}.teacher{border:1px solid var(--line);background:white;border-radius:14px;padding:11px 15px;font-weight:800}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.step{background:#dfe7e4;padding:12px 6px;text-align:center;border-radius:14px;font-weight:900;color:#667}.step.on{background:var(--accent);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:0 8px 24px #26443b0b}.card h2{font-size:clamp(25px,4vw,36px);margin-top:0}.help{font-size:20px;color:var(--muted);line-height:1.6}.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.job{border:3px solid transparent;background:#f7faf9;border-radius:20px;padding:24px 10px;font-size:22px;font-weight:900;cursor:pointer}.job .emo{display:block;font-size:52px;margin-bottom:8px}.job.sel{border-color:var(--accent);background:var(--soft)}.features{margin-top:20px;background:#f7faf9;border-radius:18px;padding:18px;font-size:19px;line-height:1.8}.nav{display:flex;gap:12px;justify-content:flex-end;margin-top:25px}.big{border:0;border-radius:17px;padding:16px 24px;font-size:21px;font-weight:900;cursor:pointer;background:var(--accent);color:white}.secondary{background:#e5ece9;color:var(--ink)}.big:disabled{opacity:.4}.mission{display:flex;align-items:center;gap:15px;padding:17px;margin:12px 0;border:2px solid var(--line);border-radius:18px;font-size:21px;font-weight:800;cursor:pointer}.mission.done{background:var(--ok);border-color:#91bc7c}.check{width:35px;height:35px;border:2px solid #8aa098;border-radius:10px;display:grid;place-items:center;font-size:24px}.photoArea{display:grid;grid-template-columns:1fr 1fr;gap:20px}.preview{min-height:300px;background:#edf2f0;border:2px dashed #a9bbb5;border-radius:20px;display:grid;place-items:center;overflow:hidden;text-align:center;color:#657}.preview img{width:100%;height:100%;max-height:430px;object-fit:contain}.upload{display:flex;flex-direction:column;gap:12px}.upload label{display:block;text-align:center}.input{width:100%;border:2px solid var(--line);border-radius:16px;padding:16px;font-size:20px}.final{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:24px;align-items:center}.final img{width:100%;max-height:420px;object-fit:contain;border-radius:20px;background:#edf2f0}.badge{display:inline-block;background:var(--soft);padding:8px 14px;border-radius:999px;font-weight:900}.quote{font-size:clamp(23px,4vw,34px);font-weight:900;line-height:1.5}.stars{font-size:38px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:10}.modalBox{background:white;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:25px}.editJob{border-bottom:1px solid var(--line);padding:16px 0}.editJob input{margin:5px 0}.customBox{margin-top:18px;padding:20px;border:3px solid var(--accent);border-radius:20px;background:#f7fbf9}
.customBox h3{font-size:25px;margin:0 0 10px}.customBox label{display:block;font-size:18px;font-weight:900;margin:12px 0 6px}
.notice{font-size:15px;color:#667;margin-top:14px}@media(max-width:700px){.steps{grid-template-columns:1fr 1fr}.photoArea,.final{grid-template-columns:1fr}.nav{flex-direction:column-reverse}.big{width:100%}.top{align-items:flex-start}.teacher{white-space:nowrap}}
</style></head><body><div class='wrap'><div class='top'><div><div style='font-weight:900;color:#477d70'>학생 진로 체험 웹앱</div><h1>🌱 미래의 나, 하루 체험 스튜디오</h1></div><button class='teacher' id='teacherBtn'>⚙️ 선생님 편집</button></div><div class='steps' id='steps'></div><main class='card' id='app'></main><p class='notice'>🔒 사진은 이 기기에서만 사용하며 서버로 전송하거나 저장하지 않습니다.</p></div><div class='modal hidden' id='modal'><div class='modalBox'><h2>⚙️ 선생님 편집</h2><p>직업 이름과 미션 3개를 바꿀 수 있어요. 이 브라우저에만 저장됩니다.</p><div id='editor'></div><div class='nav'><button class='big secondary' id='cancelEdit'>취소</button><button class='big' id='saveEdit'>저장하기</button></div></div></div><script>
const defaults=[{name:'바리스타',emoji:'☕',missions:['손님에게 밝게 인사해요','주문을 확인해요','음료를 안전하게 전달해요']},{name:'제과제빵사',emoji:'🥐',missions:['재료를 깨끗하게 준비해요','순서에 맞게 빵을 만들어요','완성된 빵을 정리해요']},{name:'영상편집자',emoji:'🎬',missions:['사용할 영상을 골라요','영상 순서를 정해요','소리와 화면을 확인해요']},{name:'반려동물관리사',emoji:'🐶',missions:['동물의 상태를 살펴봐요','깨끗한 환경을 만들어요','동물을 다정하게 돌봐요']},{name:'사서',emoji:'📚',missions:['책을 종류별로 살펴봐요','책을 제자리에 정리해요','이용자에게 책을 안내해요']},{name:'요리사',emoji:'👨‍🍳',missions:['재료를 깨끗하게 준비해요','순서에 맞게 음식을 만들어요','조리 도구를 안전하게 정리해요']},{name:'카페 매장관리원',emoji:'🧹',missions:['테이블을 깨끗하게 닦아요','물건을 제자리에 정리해요','손님이 이용하기 좋은 환경을 만들어요']},{name:'편의점 직원',emoji:'🏪',missions:['상품을 진열해요','유통기한을 확인해요','손님에게 친절하게 안내해요']},{name:'사무보조원',emoji:'🗂️',missions:['문서를 종류별로 정리해요','필요한 자료를 찾아요','사용한 물건을 제자리에 놓아요']},{name:'환경미화원',emoji:'🧤',missions:['주변의 쓰레기를 확인해요','안전하게 청소해요','청소 도구를 정리해요']},{name:'택배·포장원',emoji:'📦',missions:['상품을 확인해요','상품을 안전하게 포장해요','배송할 물건을 종류별로 정리해요']},{name:'원예관리원',emoji:'🌱',missions:['식물의 상태를 살펴봐요','필요한 만큼 물을 줘요','주변을 깨끗하게 정리해요']},{name:'세탁원',emoji:'👕',missions:['세탁물을 종류별로 나눠요','깨끗하게 세탁하고 건조해요','옷을 가지런히 정리해요']},{name:'자동차 세차원',emoji:'🚗',missions:['차량 상태를 확인해요','차량을 깨끗하게 닦아요','사용한 도구를 정리해요']},{name:'매장 상품진열원',emoji:'🛒',missions:['상품의 위치를 확인해요','상품을 보기 좋게 진열해요','빈 진열대를 확인해요']}];
let jobs=JSON.parse(localStorage.getItem('futureJobs')||'null')||defaults,
customJob={name:'',emoji:'✨',missions:['','','']},
state={page:0,job:0,custom:false,done:[false,false,false],photo:null,story:''};
const app=document.querySelector('#app'),steps=document.querySelector('#steps');
function currentJob(){return state.custom?customJob:jobs[state.job]}
const labels=['① 직업 고르기','② 미션 체험','③ 미래의 나','④ 완성'];
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}}
function header(){steps.innerHTML=labels.map((x,i)=>`<div class='step ${i===state.page?'on':''}'>${x}</div>`).join('')}
function render(){header();let j=currentJob();if(state.page===0){app.innerHTML=`<h2>① 어떤 일을 체험해 볼까요?</h2><p class='help'>관심 있는 직업을 하나 골라보세요. 목록에 없다면 <b>나만의 진로</b>를 직접 만들 수 있어요.</p><div class='jobs'>${jobs.map((x,i)=>`<button class='job ${!state.custom&&i===state.job?'sel':''}' data-job='${i}'><span class='emo'>${x.emoji}</span>${escapeHtml(x.name)}</button>`).join('')}<button class='job ${state.custom?'sel':''}' id='customCareer'><span class='emo'>➕</span>나만의 진로</button></div>${state.custom?`<div class='customBox'><h3>✨ 내가 생각하는 진로 만들기</h3><p class='help' style='font-size:18px'>예시에 없는 직업도 직접 입력해서 체험할 수 있어요.</p><label>내가 생각한 직업 이름</label><input class='input' id='customName' maxlength='30' placeholder='예: 웹툰 작가' value='${escapeHtml(customJob.name)}'><label>이 직업에서 하는 일 1</label><input class='input customMission' data-cm='0' maxlength='60' placeholder='예: 캐릭터를 그려요' value='${escapeHtml(customJob.missions[0])}'><label>이 직업에서 하는 일 2</label><input class='input customMission' data-cm='1' maxlength='60' placeholder='예: 이야기를 만들어요' value='${escapeHtml(customJob.missions[1])}'><label>이 직업에서 하는 일 3</label><input class='input customMission' data-cm='2' maxlength='60' placeholder='예: 그림을 완성해요' value='${escapeHtml(customJob.missions[2])}'><button class='teacher' id='customSpeak' style='margin-top:12px'>🔊 입력 안내 읽기</button></div>`:`<div class='features'><b>${j.emoji} ${escapeHtml(j.name)}은 이런 일을 연습해요.</b><br>${j.missions.map((m,i)=>`${i+1}. ${escapeHtml(m)}`).join('<br>')}</div>`}<div class='nav'><button class='big' id='next'>이 직업 체험하기 →</button></div>`;document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{state.job=+b.dataset.job;state.custom=false;state.done=[false,false,false];render()});document.querySelector('#customCareer').onclick=()=>{state.custom=true;state.done=[false,false,false];render()};if(state.custom){document.querySelector('#customName').oninput=e=>customJob.name=e.target.value;document.querySelectorAll('[data-cm]').forEach(x=>x.oninput=e=>customJob.missions[+x.dataset.cm]=e.target.value);document.querySelector('#customSpeak').onclick=()=>speak('내가 생각한 직업 이름과, 그 직업에서 하는 일 세 가지를 적어 보세요.');}document.querySelector('#next').onclick=()=>{if(state.custom){customJob.name=document.querySelector('#customName').value.trim();document.querySelectorAll('[data-cm]').forEach(x=>customJob.missions[+x.dataset.cm]=x.value.trim());if(!customJob.name||customJob.missions.some(x=>!x)){alert('나만의 진로 이름과 하는 일 3개를 모두 입력해 주세요.');return;}}state.page=1;render()}}
else if(state.page===1){app.innerHTML=`<h2>② ${j.name} 미션 3개</h2><p class='help'>미션을 하나씩 눌러 완료해 보세요. 🔊 버튼을 누르면 읽어줍니다.</p>${j.missions.map((m,i)=>`<div class='mission ${state.done[i]?'done':''}' data-m='${i}'><div class='check'>${state.done[i]?'✓':''}</div><div style='flex:1'>${m}</div><button class='teacher' data-s='${i}'>🔊</button></div>`).join('')}<div class='nav'><button class='big secondary' id='back'>← 이전</button><button class='big' id='next' ${state.done.every(Boolean)?'':'disabled'}>미션 완료! →</button></div>`;document.querySelectorAll('[data-m]').forEach(x=>x.onclick=e=>{if(e.target.dataset.s!==undefined)return;let i=+x.dataset.m;state.done[i]=!state.done[i];render()});document.querySelectorAll('[data-s]').forEach(x=>x.onclick=e=>{e.stopPropagation();speak(j.missions[+x.dataset.s])});document.querySelector('#back').onclick=()=>{state.page=0;render()};document.querySelector('#next').onclick=()=>{state.page=2;render()}}
else if(state.page===2){app.innerHTML=`<h2>③ 미래의 내 모습을 준비해요</h2><div class='photoArea'><div class='preview' id='preview'>${state.photo?`<img src='${state.photo}' alt='내 사진'>`:`<div><div style='font-size:70px'>📷</div>내 사진이 여기에 보여요</div>`}</div><div class='upload'><label class='big'>📁 사진 선택<input id='file' type='file' accept='image/*' hidden></label><label class='big secondary'>📸 사진 촬영<input id='camera' type='file' accept='image/*' capture='user' hidden></label><label style='font-size:20px;font-weight:900'>미래의 나에게 한마디</label><textarea class='input' id='story' rows='5' maxlength='100' placeholder='예: 나는 사람들에게 맛있는 커피를 만들어 주는 바리스타가 되고 싶어요.'>${state.story}</textarea><button class='teacher' id='listen'>🔊 내 문장 들어보기</button></div></div><div class='nav'><button class='big secondary' id='back'>← 이전</button><button class='big' id='next'>나의 미래 완성하기 →</button></div>`;function load(inp){inp.onchange=()=>{let f=inp.files[0];if(!f)return;if(state.photo)URL.revokeObjectURL(state.photo);state.photo=URL.createObjectURL(f);state.story=document.querySelector('#story').value;render()}}load(document.querySelector('#file'));load(document.querySelector('#camera'));document.querySelector('#story').oninput=e=>state.story=e.target.value;document.querySelector('#listen').onclick=()=>speak(state.story||`나는 ${j.name} 일을 체험하고 있어요.`);document.querySelector('#back').onclick=()=>{state.page=1;render()};document.querySelector('#next').onclick=()=>{state.story=document.querySelector('#story').value;state.page=3;render()}}
else{let msg=state.story.trim()||`나는 ${j.name}이 되어 멋지게 일하고 싶어요.`;app.innerHTML=`<h2>🎉 나의 미래가 완성됐어요!</h2><div class='final'><div>${state.photo?`<img src='${state.photo}' alt='미래의 나'>`:`<div class='preview' style='min-height:280px'><div style='font-size:90px'>${j.emoji}</div></div>`}</div><div><span class='badge'>미래의 직업</span><h2 style='font-size:40px'>${j.emoji} ${j.name}</h2><div class='stars'>⭐⭐⭐</div><p class='quote'>“${escapeHtml(msg)}”</p><button class='big' id='speakFinal'>🔊 나의 미래 발표하기</button></div></div><div class='features'><b>오늘 완료한 직업 미션</b><br>${j.missions.map(m=>'✓ '+m).join('<br>')}</div><div class='nav'><button class='big secondary' id='again'>↻ 다시 체험하기</button></div>`;document.querySelector('#speakFinal').onclick=()=>speak(`나의 미래 직업은 ${j.name}입니다. ${msg} 오늘의 직업 미션도 모두 완료했습니다. 참 잘했어요!`);document.querySelector('#again').onclick=()=>{state={page:0,job:0,custom:false,done:[false,false,false],photo:null,story:''};customJob={name:'',emoji:'✨',missions:['','','']};render()}}
}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
const modal=document.querySelector('#modal'),editor=document.querySelector('#editor');document.querySelector('#teacherBtn').onclick=()=>{editor.innerHTML=jobs.map((j,i)=>`<div class='editJob'><b>${j.emoji} 직업 ${i+1}</b><input class='input' data-n='${i}' value='${j.name.replace(/'/g,'&#39;')}'>${j.missions.map((m,k)=>`<input class='input' data-mm='${i}-${k}' value='${m.replace(/'/g,'&#39;')}'>`).join('')}</div>`).join('');modal.classList.remove('hidden')};document.querySelector('#cancelEdit').onclick=()=>modal.classList.add('hidden');document.querySelector('#saveEdit').onclick=()=>{jobs=jobs.map((j,i)=>({...j,name:document.querySelector(`[data-n="${i}"]`).value.trim()||j.name,missions:j.missions.map((m,k)=>document.querySelector(`[data-mm="${i}-${k}"]`).value.trim()||m)}));localStorage.setItem('futureJobs',JSON.stringify(jobs));modal.classList.add('hidden');render()};render();
</script></body></html>
